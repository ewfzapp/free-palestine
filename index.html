<title>Free Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#050505;
    --paper:#F2EFE7;
    --red:#CE1126;
    --green:#0E8A4B;
    --net: rgba(242,239,231,.9);
    --net-dim: rgba(242,239,231,.10);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:"Archivo", ui-sans-serif, system-ui, sans-serif;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient fishnet texture, whole page, very low contrast */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(45deg, var(--net-dim) 0 1.5px, transparent 1.5px 30px),
      repeating-linear-gradient(-45deg, var(--net-dim) 0 1.5px, transparent 1.5px 30px);
    pointer-events:none;
    z-index:0;
  }

  .topbar{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    padding:26px 32px 0;
  }
  .topbar .mark{ display:flex; align-items:center; gap:10px; }
  .topbar svg{ width:28px; height:auto; display:block; }
  .topbar span{
    font-size:.7rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(242,239,231,.55);
  }

  .zigzag{
    position:relative; z-index:1;
    height:13px;
    margin-top:34px;
    background:
      linear-gradient(135deg, transparent 50%, var(--paper) 50%) 0 0/15px 13px repeat-x,
      linear-gradient(45deg, var(--paper) 50%, transparent 50%) 0 0/15px 13px repeat-x;
    opacity:.9;
  }
  .net-band{
    position:relative; z-index:1;
    height:clamp(64px,10vw,120px);
    background-color:#0d0d0d;
    background-image:
      repeating-linear-gradient(45deg, var(--net) 0 3px, transparent 3px 26px),
      repeating-linear-gradient(-45deg, var(--net) 0 3px, transparent 3px 26px);
  }
  .zigzag.flip{ transform:scaleY(-1); margin-top:0; }

  main{
    position:relative; z-index:1;
    padding:clamp(48px,9vw,96px) 32px clamp(24px,5vw,40px);
    text-align:center;
  }
  .eyebrow{
    display:block;
    font-weight:800;
    font-size:clamp(1rem,2.4vw,1.4rem);
    letter-spacing:.5em;
    text-transform:uppercase;
    color:var(--paper);
    margin-left:.5em; /* optical balance for the added tracking */
  }
  h1{
    margin:10px 0 0;
    font-family:"Anton", ui-sans-serif, sans-serif;
    text-transform:uppercase;
    font-size:clamp(4.2rem, 17vw, 13rem);
    line-height:.82;
    color:var(--paper);
    text-wrap:balance;
  }
  .underline{
    height:clamp(10px,1.6vw,16px);
    width:min(78%, 720px);
    margin:clamp(14px,2.4vw,22px) auto 0;
    background:linear-gradient(90deg, var(--green) 0 50%, var(--red) 50% 100%);
    transform-origin:left center;
    animation: draw 1.1s .2s cubic-bezier(.22,.9,.3,1) both;
  }
  @media (prefers-reduced-motion: reduce){ .underline{ animation:none; } }
  @keyframes draw{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

  .counter-wrap{
    position:relative; z-index:1;
    display:flex; justify-content:center;
    padding:8px 32px 48px;
  }
  .counter{
    display:flex; align-items:stretch;
    border:1.5px solid rgba(242,239,231,.28);
  }
  .counter .swatch{
    width:34px;
    background-image:
      repeating-linear-gradient(45deg, var(--net) 0 2px, transparent 2px 12px),
      repeating-linear-gradient(-45deg, var(--net) 0 2px, transparent 2px 12px);
    background-color:#0d0d0d;
    border-right:1.5px solid rgba(242,239,231,.28);
  }
  .counter .body{
    display:flex; align-items:center; gap:12px;
    padding:12px 20px;
  }
  .counter .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    animation: pulse 2.2s ease-in-out infinite;
    flex:none;
  }
  @media (prefers-reduced-motion: reduce){ .counter .dot{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  .counter .label{
    font-size:.66rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(242,239,231,.55);
  }
  .counter b{
    font-variant-numeric: tabular-nums;
    font-size:1.3rem; font-weight:800;
    color:var(--paper);
    letter-spacing:.02em;
  }
</style>

<div class="topbar">
  <div class="mark">
    <svg viewBox="0 0 30 20" aria-hidden="true">
      <rect width="30" height="20" fill="#F5F3EE"/>
      <rect width="30" height="6.667" fill="#000000"/>
      <rect y="13.333" width="30" height="6.667" fill="#0E8A4B"/>
      <polygon points="0,0 11,10 0,20" fill="#CE1126"/>
    </svg>
    <span>Palestine</span>
  </div>
  <span style="font-size:.7rem; font-weight:700; letter-spacing:.14em; color:rgba(242,239,231,.35);">2026</span>
</div>

<div class="zigzag"></div>
<div class="net-band"></div>
<div class="zigzag flip"></div>

<main>
  <span class="eyebrow">Free</span>
  <h1>Palestine</h1>
  <div class="underline"></div>
</main>

<div class="counter-wrap">
  <div class="counter">
    <div class="swatch" aria-hidden="true"></div>
    <div class="body">
      <span class="dot" aria-hidden="true"></span>
      <span class="label">Visiteurs</span>
      <b id="count">—</b>
    </div>
  </div>
</div>

<script>
  // Compteur public : appelle le Cloudflare Worker (voir worker.js).
  // Remplace l'URL ci-dessous par celle de ton Worker une fois déployé
  // (workers.dev, ou une route sur ton propre domaine Cloudflare).
  const COUNTER_ENDPOINT = "https://free-palestine-counter.TON-SOUS-DOMAINE.workers.dev/";

  (async () => {
    const el = document.getElementById('count');
    try {
      const res = await fetch(COUNTER_ENDPOINT);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      el.textContent = Number(data.count).toLocaleString('fr-FR');
    } catch (e) {
      el.textContent = '·';
    }
  })();
</script>
